  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff5d6"/><stop offset=".2" stop-color="#f4d58f"/><stop offset=".48" stop-color="#bd8b3f"/><stop offset=".72" stop-color="#fff0bd"/><stop offset="1" stop-color="#9b682b"/>
