  async function query(table,columns,filters=[]){

 function empty(message){return '<div class="nx-admin-empty">◇<br>'+esc(message)+'</div>';}
 async function cards(rows,type){

   const title=r.title||r.store_name||r.name||(r.fee_type?(type==="retail_fee_payment"?(r.fee_type==="logo"?"Онлайн дэлгүүрийн логоны төлбөр":"Жижиглэнгийн бараа байршуулалтын төлбөр"):(r.fee_type==="logo"?"Нийлүүлэгчийн логоны төлбөр":"Бөөний бараа байршуулалтын төлбөр")):("Хүсэлт "+String(r.id||"").slice(0,8)));
   const details=[];

   if(r.buyer_id)details.push(["Худалдан авагчийн ID",String(r.buyer_id).slice(0,8)+"…"]);
   if(r.buyer_phone)details.push(["Захиалагчийн утас",r.buyer_phone]);
   if(r.supplier_id)details.push(["Нийлүүлэгчийн ID",r.supplier_id]);
   if(r.delivery_address)details.push(["Хүргэлтийн хаяг",r.delivery_address]);
   if(Array.isArray(r.items))details.push(["Захиалгын мөр",r.items.length+" төрөл"]);
   if(r.email)details.push(["И-мэйл",r.email]);
   if(r.user_id)details.push(["Төлбөр илгээсэн хэрэглэгч",String(r.user_id).slice(0,8)+"…"]);
   if(r.product_id)details.push(["Барааны ID",String(r.product_id).slice(0,8)+"…"]);
   if(r.store_id)details.push(["Дэлгүүрийн ID",String(r.store_id).slice(0,8)+"…"]);
   if(r.bank_name)details.push(["Банк",r.bank_name]);
   if(r.transfer_reference)details.push(["Гүйлгээний утга",r.transfer_reference]);

   if(r.stock_quantity!==undefined)details.push(["Үлдэгдэл",Number(r.stock_quantity).toLocaleString("mn-MN")+" ширхэг"]);
   if(r.min_order_quantity!==undefined)details.push(["Доод захиалга",Number(r.min_order_quantity)+" ширхэг"]);
   if(Array.isArray(r.wholesale_price_tiers)&&r.wholesale_price_tiers.length)details.push(["Бөөний үнэ",r.wholesale_price_tiers.map(t=>Number(t.min_qty)+"+ ш: "+money(t.price)).join(" · ")]);
   if(r.type)details.push(["Нийлүүлэгчийн төрөл",r.type]);
   if(r.package_type)details.push(["Багц",r.package_type]);
   if(r.location||r.address)details.push(["Байршил",r.location||r.address]);
   if(r.fee_type)details.push(["Төлбөрийн төрөл",type==="retail_fee_payment"?(r.fee_type==="logo"?"Онлайн дэлгүүрийн лого":"Жижиглэнгийн бараа байршуулалт"):(r.fee_type==="logo"?"Нийлүүлэгчийн лого":"Бөөний бараа байршуулалт")]);
   if(r.account_number)details.push(["NEXORA төлбөр хүлээн авах данс",r.bank_name+" · "+r.account_number+" · "+(r.account_holder||"")]);

     const byId=new Map((profiles||[]).map(p=>[p.id,p]));
     data.forEach(r=>{
      const profile=byId.get(r.store_id);
      if(profile){
       r.store_name=profile.store_name;
       r.owner_type=profile.owner_type;
       r.phone=r.phone||profile.phone;
      }
     });
    }
   }
   if(activeTab==="orders"){
    body.innerHTML='<h2 class="nx-admin-section-title">'+sections.orders[0]+'</h2><p class="nx-admin-section-note">'+sections.orders[1]+'</p>'+
     ((data||[]).length?'<div class="nx-admin-list">'+data.map(o=>'<article class="nx-admin-card"><h3>Захиалга #'+esc(String(o.id).slice(0,12))+'</h3><p class="nx-market-price">'+money(o.total_amount)+'</p><div class="nx-admin-meta"><div><strong>Захиалгын төлөв:</strong> '+esc(statusNames[o.status]||o.status||"—")+'</div><div><strong>Төлбөр:</strong> '+esc(statusNames[o.payment_status]||o.payment_status||"—")+'</div><div><strong>Огноо:</strong> '+esc(o.created_at?new Date(o.created_at).toLocaleString("mn-MN"):"—")+'</div></div><pre class="nx-admin-order-items">'+esc(JSON.stringify(o.items,null,2))+'</pre></article>').join("")+'</div>':empty("Одоогоор захиалга бүртгэгдээгүй байна."));
   }else{
    body.innerHTML='<h2 class="nx-admin-section-title">'+sections[activeTab][0]+'</h2><p class="nx-admin-section-note">'+sections[activeTab][1]+'</p>'+await cards(data,type);
   }
   body.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.id,b.dataset.action));
  }catch(e){
   body.innerHTML='<div class="nx-admin-error">Мэдээлэл татахад алдаа гарлаа: '+esc(e?.message||e)+'</div><button class="nx-admin-refresh" id="nx-admin-retry" type="button">↻ Дахин оролдох</button>';
   const retry=document.getElementById("nx-admin-retry");
   if(retry)retry.onclick=loadTab;
  }
 }
 async function review(type,id,action){
  if(!confirm(action==="approve"?"Энэ хүсэлтийг зөвшөөрөх үү?":"Энэ хүсэлтээс татгалзах уу?"))return;
  let result;
  try{
   if(type==="ad_payment")result=await db.rpc(action==="approve"?"admin_approve_payment_request":"admin_reject_payment_request",{p_request_id:id});
   else if(type==="free_ad")result=await db.rpc("admin_review_free_ad",{p_ad_id:id,p_approve:action==="approve"});
   else if(type==="store_payment"){
    const paymentId=String(id??"").trim();
    if(!paymentId)throw new Error("Төлбөрийн хүсэлтийн ID хоосон байна.");
    const {data:payment,error:lookupError}=await db.from("nexora_store_payments").select("id,status").eq("id",paymentId).maybeSingle();
    if(lookupError)throw lookupError;
    if(!payment)throw new Error("Дэлгүүрийн төлбөрийн хүсэлт олдсонгүй. Дахин ачаалаад оролдоно уу. ID: "+paymentId);
    if(payment.status!=="pending")throw new Error("Энэ төлбөр өмнө нь шийдвэрлэгдсэн байна. Төлөв: "+payment.status);
    result=action==="approve"?await db.rpc("nexora_approve_store_payment",{p_payment_id:payment.id}):await db.rpc("nexora_reject_store_payment",{p_payment_id:payment.id,p_note:"Админы шийдвэрээр татгалзсан"});
   }
   else if(type==="order_payment")result=await db.rpc("nexora_review_market_order_payment",{p_payment_id:id,p_approve:action==="approve",p_note:action==="approve"?null:"Админы шийдвэрээр татгалзсан"});
   else if(type==="product")result=await db.rpc("nexora_review_market_retail_product",{p_product_id:id,p_approve:action==="approve"});
   else if(type==="retail_fee_payment")result=await db.rpc("nexora_review_market_retail_fee_payment",{p_payment_id:id,p_approve:action==="approve",p_note:action==="approve"?null:"Төлбөрийн баримт баталгаажаагүй"});
   else if(type==="wholesale_product")result=await db.rpc("nexora_review_wholesale_product",{p_product_id:id,p_approve:action==="approve"});
   else if(type==="wholesale_fee_payment")result=await db.rpc("nexora_review_wholesale_fee_payment",{p_payment_id:id,p_approve:action==="approve",p_note:action==="approve"?null:"Төлбөрийн баримт баталгаажаагүй"});
   else if(type==="supplier")result=await db.from("market_suppliers").update({status:action==="approve"?"approved":"rejected"}).eq("id",id);
   if(result?.error)throw result.error;
   alert("Хүсэлтийг амжилттай шийдвэрлэлээ.");
   await loadTab();
  }catch(e){alert("Үйлдэл амжилтгүй: "+(e?.message||e));}
 }
 function renderLogin(message="",isError=false){
   root.innerHTML='<section class="nx-admin-login"><h1>АДМИН НЭВТРЭХ</h1><p>Зөвхөн NEXORA админы эрхтэй бүртгэлээр нэвтэрнэ үү.</p><form id="nx-admin-login-form"><label for="nx-admin-email">И-мэйл</label><input id="nx-admin-email" name="email" type="email" autocomplete="username" required><label for="nx-admin-password">Нууц үг</label><input id="nx-admin-password" name="password" type="password" autocomplete="current-password" required><p id="nx-admin-login-message" class="'+(isError?'is-error':'')+'">'+esc(message)+'</p><button class="nx-admin-login-submit" type="submit">Нэвтрэх</button></form><a href="./index.html">← Хэрэглэгчийн сайт руу буцах</a></section>';
   document.getElementById("nx-admin-login-form").onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector("button[type=submit]"),v=Object.fromEntries(new FormData(form).entries());button.disabled=true;button.textContent="Шалгаж байна…";const {error}=await db.auth.signInWithPassword({email:String(v.email).trim(),password:v.password});if(error){renderLogin(error.message,true);return;}await init();};
  }
  async function init(){
   root.innerHTML='<div class="nx-admin-loading">Админ эрх шалгаж байна…</div>';
   try{const {data,error}=await db.auth.getUser();if(error)throw error;if(!data.user){renderLogin();return;}
    const {data:themeRow}=await db.from("nexora_settings").select("admin_theme_config").eq("id",1).maybeSingle();if(themeRow?.admin_theme_config)applyAdminTheme(themeRow.admin_theme_config);
    if(!(await adminCheck())){root.innerHTML='<section class="nx-admin-login"><h1>ХАНДАХ ЭРХГҮЙ</h1><p>Энэ бүртгэлд NEXORA админы эрх олгогдоогүй байна.</p><button class="nx-admin-login-submit" id="nx-admin-denied-logout" type="button">Өөр бүртгэлээр нэвтрэх</button><a href="./index.html">Хэрэглэгчийн сайт руу буцах</a></section>';document.getElementById("nx-admin-denied-logout").onclick=async()=>{await db.auth.signOut();renderLogin();};return;}
    loadTab();
   }catch(e){root.innerHTML='<div class="nx-admin-error">Админ эрх шалгахад алдаа гарлаа: '+esc(e?.message||e)+'</div>';}
  }
  init();
})();</script></body></html>
