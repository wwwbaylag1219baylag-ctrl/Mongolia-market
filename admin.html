\n/* Full-screen admin settings pages */\nbody.nx-admin-focus{padding:0!important;min-height:100vh;width:100%;overflow-x:hidden}#nexora-admin-app.nx-admin-focus-app{width:100%!important;max-width:none!important;min-height:100vh;margin:0!important;padding:0 16px 32px!important}.nx-admin-focusbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;margin:0 -16px 18px;padding:10px 16px;background:#090909;border-bottom:1px solid rgba(214,173,85,.25)}.nx-admin-focusbar strong{flex:1;text-align:center;color:#f0d28a;font-size:14px;letter-spacing:.4px}.nx-admin-focusbar .nx-admin-home{flex:0 0 auto;min-height:40px;padding:9px 12px;border:1px solid rgba(214,173,85,.45);border-radius:10px;background:#171717;color:#f0d28a;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap}.nx-admin-back{min-height:40px;padding:9px 12px;border:1px solid rgba(214,173,85,.45);border-radius:10px;background:#171717;color:#f0d28a;font-weight:700}.nx-admin-focus-app #nx-admin-body{width:100%;max-width:1100px;margin:0 auto}.nx-admin-focus-app .nx-admin-section-title{margin-top:8px;font-size:24px}.nx-admin-focus-app .nx-admin-section-note{font-size:14px}@media(max-width:600px){#nexora-admin-app.nx-admin-focus-app{padding:0 12px 24px!important}.nx-admin-focusbar{margin:0 -12px 16px;padding:9px 12px}.nx-admin-focusbar strong{font-size:12px}.nx-admin-back,.nx-admin-focusbar .nx-admin-logout{font-size:11px;padding:8px}.nx-admin-focus-app .nx-admin-section-title{font-size:21px}}\n</style></head><body><main id="nexora-admin-app"><div class="nx-admin-loading">Админ самбар ачаалж байна…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const u="https://grbpbmowhkbtuxostfny.supabase.co",k="sb_publishable_wspX-C4VBPJMmvWuQgsMTw_h40w8O3x";window.NEXORA_SUPABASE=window.supabase.createClient(u,k,{auth:{storageKey:"nexora-admin-auth",storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});})();</script><script>(function(){
 const db=window.NEXORA_SUPABASE,root=document.getElementById("nexora-admin-app");
 if(!db||!root)return;
 let activeTab="overview";
 const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const money=v=>Number(v||0).toLocaleString("mn-MN")+" ₮";
 const tabs=[
  ["overview","Тойм"],["ads","Энгийн зар (хуучин)"],["payments","Зарын төлбөр"],["products","Бараа"],
  ["commercePayments","Худалдааны төлбөр"],["suppliers","Нийлүүлэгч"],
  ["pricing","Үнийн тохиргоо"],["theme","Платформын өнгө"]
 ];
 const sections={
  ads:["Хуучин үнэгүй зарын хүсэлт","Өмнөх үнэгүй зарын хяналтад үлдсэн хүсэлтүүд"],
  payments:["Зарын төлбөр","Төлбөрийн баримт болон багцын мэдээлэл"],
  products:["Бараа бүтээгдэхүүн","Нийтлэх зөвшөөрөл хүлээж буй бараа"],
  commercePayments:["Худалдааны нэгдсэн төлбөр","Дэлгүүрийн эрх, нийлүүлэгчийн бүртгэл, жижиглэн болон бөөний бараа нийтлэх бүх төлбөрийг нэг жагсаалтаас хянана. Зар сурталчилгааны төлбөр тусдаа хэвээр."],
  suppliers:["Нийлүүлэгч","Бүртгэлтэй нийлүүлэгчдийн жагсаалт"],
  pricing:["Үнийн тохиргоо","Зарын багц болон лого, бараа байршуулалтын суурь хураамжийг удирдах"],
  theme:["Платформын өнгөний тохиргоо","Админ самбарын харагдах өнгийг өөрчлөх"]
 };
 const statusNames={pending:"Хүлээгдэж байна",pending_review:"Хяналтад",approved:"Зөвшөөрсөн",active:"Идэвхтэй",rejected:"Татгалзсан",pending_payment:"Төлбөр хүлээгдэж байна",paid:"Төлөгдсөн",unpaid:"Төлөгдөөгүй",processing:"Боловсруулж байна",completed:"Дууссан",cancelled:"Цуцалсан"};
 async function adminCheck(user){
  if(!user?.id)return false;
  const {data:row,error}=await db.from("nexora_admins").select("user_id").eq("user_id",user.id).maybeSingle();
  if(error)throw error;
  return !!row;
 }
 function shell(body){
   const focusMode=activeTab==="pricing"||activeTab==="theme";
   document.body.classList.toggle("nx-admin-focus",focusMode);
   root.classList.toggle("nx-admin-focus-app",focusMode);
   root.innerHTML=focusMode
    ? '<div class="nx-admin-focusbar"><button type="button" class="nx-admin-back" id="nx-admin-back">← АДМИН ЦЭС</button><strong>'+(activeTab==="pricing"?"ҮНИЙН ТОХИРГОО":"ПЛАТФОРМЫН ӨНГӨ")+'</strong><a class="nx-admin-home" href="./index.html" aria-label="Үндсэн нүүр рүү буцах">⌂ НҮҮР</a><button class="nx-admin-logout" id="nx-admin-logout" type="button">Гарах</button></div><div id="nx-admin-body">'+body+'</div>'
    : '<div class="nx-admin-head"><div><div class="nexora-ad-heading">АДМИН УДИРДЛАГА</div><p class="nx-admin-subtitle">NEXORA платформын зар, худалдаа, төлбөр болон хүсэлтүүдийн нэгдсэн удирдлага.</p></div><div class="nx-admin-head-actions"><a class="nx-admin-home" href="./index.html" aria-label="Үндсэн нүүр" title="Үндсэн нүүр">⌂ НҮҮР</a><button class="nx-admin-logout" id="nx-admin-logout" type="button">Гарах</button></div></div>'+
    '<nav class="nx-admin-tabs" aria-label="Админ цэс">'+tabs.map(t=>'<button type="button" data-admin-tab="'+t[0]+'" class="'+(activeTab===t[0]?'active':'')+'">'+t[1]+'</button>').join("")+'</nav>'+
    '<div class="nx-admin-toolbar"><input id="nx-admin-search" class="nx-admin-search" type="search" placeholder="Энэ жагсаалтаас хайх…" aria-label="Админ жагсаалтаас хайх"><button class="nx-admin-refresh" id="nx-admin-refresh" type="button">↻ Шинэчлэх</button></div>'+
    '<div id="nx-admin-body">'+body+'</div>';
   root.querySelectorAll("[data-admin-tab]").forEach(b=>b.onclick=()=>{activeTab=b.dataset.adminTab;loadTab();});
   const back=document.getElementById("nx-admin-back");if(back)back.onclick=()=>{activeTab="overview";loadTab();};
   const refresh=document.getElementById("nx-admin-refresh");if(refresh)refresh.onclick=loadTab;
   document.getElementById("nx-admin-logout").onclick=async()=>{await db.auth.signOut();renderLogin();};
   const search=document.getElementById("nx-admin-search");
   if(search)search.oninput=()=>{const term=search.value.trim().toLocaleLowerCase("mn");root.querySelectorAll("#nx-admin-body .nx-admin-card").forEach(card=>{card.hidden=!!term&&!card.textContent.toLocaleLowerCase("mn").includes(term);});};
  }
  async function query(table,columns,filters=[]){
  let q=db.from(table).select(columns).order("created_at",{ascending:false}).limit(50);
  filters.forEach(([k,v])=>q=q.eq(k,v));
  return await q;
 }
 function empty(message){return '<div class="nx-admin-empty">◇<br>'+esc(message)+'</div>';}
 async function cards(rows,type){
  if(!rows||!rows.length)return empty("Одоогоор хүлээгдэж буй хүсэлт алга.");
  const html=await Promise.all(rows.map(async r=>{
   const ad=type==="ad_payment"?(Array.isArray(r.classified_ads)?r.classified_ads[0]:r.classified_ads):null;
   const title=type==="ad_payment"&&ad?("Зарын төлбөр · "+(ad.title||"Гарчиггүй зар")):type==="wholesale_order_payment"?"Бөөний захиалгын төлбөрийн баримт":r.payment_purpose==="renewal"?"Нийлүүлэгчийн сарын эрх сунгах":r.title||r.store_name||r.name||r.supplier_name||(r.fee_type?(type==="retail_fee_payment"?(r.fee_type==="logo"?"Онлайн дэлгүүрийн логоны төлбөр":"Жижиглэнгийн бараа байршуулалтын төлбөр"):(r.fee_type==="logo"?"Нийлүүлэгчийн логоны төлбөр":"Бөөний бараа байршуулалтын төлбөр")):("Хүсэлт "+String(r.id||"").slice(0,8)));
   const details=[];
   if(ad){
    if(ad.category)details.push(["Зарын ангилал",ad.category]);
    if(ad.subcategory)details.push(["Дэд ангилал",ad.subcategory]);
    if(ad.description)details.push(["Зарын тайлбар",ad.description]);
    if(ad.phone)details.push(["Зар нийтлэгчийн утас",ad.phone]);
    if(ad.price!==null&&ad.price!==undefined)details.push(["Зарын үнэ",money(ad.price)]);
    if(ad.package_type)details.push(["Сонгосон багц",ad.package_type]);
    if(ad.package_days)details.push(["Нийтлэх хугацаа",ad.package_days+" хоног"]);
   }
   if(r.owner_type)details.push(["Эзэмшигч",r.owner_type==="company"?"Байгууллага":r.owner_type==="individual"?"Хувь хүн":r.owner_type]);
   if(r.duration_days)details.push(["Эрхийн хугацаа",r.duration_days+" хоног"]);
   if(r.bank_accounts)details.push(["Төлбөр хүлээн авах данс",r.bank_accounts.bank_name+" · "+r.bank_accounts.account_number+" · "+r.bank_accounts.account_holder]);
   if(r.payment_purpose)details.push(["Төлбөрийн зориулалт",r.payment_purpose==="renewal"?"Сарын эрх сунгалт":"Анхны бүртгэл"]);
   if(r.phone)details.push(["Утас",r.phone]);
   if(r.buyer_name)details.push(["Захиалагч",r.buyer_name]);
   if(r.buyer_id)details.push(["Худалдан авагчийн ID",String(r.buyer_id).slice(0,8)+"…"]);
   if(r.buyer_phone)details.push(["Захиалагчийн утас",r.buyer_phone]);
   if(r.supplier_id)details.push(["Нийлүүлэгчийн ID",r.supplier_id]);
   if(r.delivery_address)details.push(["Хүргэлтийн хаяг",r.delivery_address]);
   if(Array.isArray(r.items))details.push(["Захиалгын мөр",r.items.length+" төрөл"]);
   if(r.email)details.push(["И-мэйл",r.email]);
   if(r.user_id)details.push(["Төлбөр илгээсэн хэрэглэгч",String(r.user_id).slice(0,8)+"…"]);
   if(r.product_id)details.push(["Барааны ID",String(r.product_id).slice(0,8)+"…"]);
   if(r.store_id)details.push(["Дэлгүүрийн ID",String(r.store_id).slice(0,8)+"…"]);
   if(r.bank_name)details.push(["Банк",r.bank_name]);
   if(r.transfer_reference)details.push(["Гүйлгээний утга",r.transfer_reference]);
   if(r.category)details.push(["Ангилал",r.category]);
   if(r.stock_quantity!==undefined)details.push(["Үлдэгдэл",Number(r.stock_quantity).toLocaleString("mn-MN")+" ширхэг"]);
   if(r.min_order_quantity!==undefined)details.push(["Доод захиалга",Number(r.min_order_quantity)+" ширхэг"]);
   if(Array.isArray(r.wholesale_price_tiers)&&r.wholesale_price_tiers.length)details.push(["Бөөний үнэ",r.wholesale_price_tiers.map(t=>Number(t.min_qty)+"+ ш: "+money(t.price)).join(" · ")]);
   if(r.type)details.push(["Нийлүүлэгчийн төрөл",r.type]);

    const loaded=await Promise.all(sources.map(async x=>{const {data,error}=await query(x[0],x[1],[["status",x[3]||"pending"]]);if(error)throw error;return {data:data||[],type:x[2]};}));
    const blocks=await Promise.all(loaded.map(x=>cards(x.data,x.type)));
    body.innerHTML='<h2 class="nx-admin-section-title">'+sections.commercePayments[0]+'</h2><p class="nx-admin-section-note">'+sections.commercePayments[1]+'</p>'+(loaded.every(x=>!x.data.length)?empty("Худалдааны төлбөрийн хүлээгдэж буй хүсэлт алга."):blocks.join(""));
    body.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.id,b.dataset.action));
    return;
   }
   const cfg={
    ads:["classified_ads","id,title,category,price,status,package_type,package_days,package_amount,created_at",[["status","pending_review"]],"free_ad"],
    payments:["payment_requests","id,ad_id,user_id,amount,package_days,transfer_reference,receipt_path,status,created_at,classified_ads(id,title,category,subcategory,description,price,phone,package_type,package_days,package_amount,latitude,longitude,ad_images(image_path,display_order))",[["status","pending_review"]],"ad_payment"],
    wholesaleProducts:["wholesale_products","id,title,category,price,owner_id,status,stock_quantity,min_order_quantity,wholesale_price_tiers,created_at",[["status","pending"]],"wholesale_product"],
    stores:["nexora_store_payments","id,store_id,user_id,amount,bank_name,transfer_reference,receipt_path,status,created_at",[["status","pending"]],"store_payment"],
    suppliers:["market_suppliers","id,name,type,owner_type,register_no,phone,email,address,status,created_at",[],""],

   }[activeTab];
   const [table,cols,filters,type]=cfg;
   body.innerHTML='<h2 class="nx-admin-section-title">'+sections[activeTab][0]+'</h2><p class="nx-admin-section-note">'+sections[activeTab][1]+'</p><div class="nx-admin-loading">Жагсаалт ачаалж байна…</div>';
   const {data,error}=await query(table,cols,filters);
   if(error)throw error;
   if(activeTab==="stores"&&data?.length){
    const ids=[...new Set(data.map(r=>r.store_id).filter(Boolean))];
    if(ids.length){
     const {data:profiles,error:profileError}=await db.from("nexora_store_profiles").select("id,store_name,owner_type,phone").in("id",ids);
     if(profileError)throw profileError;
     const byId=new Map((profiles||[]).map(p=>[p.id,p]));
     data.forEach(r=>{
      const profile=byId.get(r.store_id);
      if(profile){
       r.store_name=profile.store_name;
       r.owner_type=profile.owner_type;
       r.phone=r.phone||profile.phone;
      }
     });
    }
   }
   body.innerHTML='<h2 class="nx-admin-section-title">'+sections[activeTab][0]+'</h2><p class="nx-admin-section-note">'+sections[activeTab][1]+'</p>'+await cards(data,type);
   body.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.id,b.dataset.action));
  }catch(e){
   body.innerHTML='<div class="nx-admin-error">Мэдээлэл татахад алдаа гарлаа: '+esc(e?.message||e)+'</div><button class="nx-admin-refresh" id="nx-admin-retry" type="button">↻ Дахин оролдох</button>';
   const retry=document.getElementById("nx-admin-retry");
   if(retry)retry.onclick=loadTab;
  }
 }
 async function review(type,id,action){
  if(!confirm(action==="approve"?"Энэ хүсэлтийг зөвшөөрөх үү?":"Энэ хүсэлтээс татгалзах уу?"))return;
  let result, supplierRejectNote=null;
  if(type==="supplier_registration_payment"&&action==="reject"){
   const entered=window.prompt("Нийлүүлэгчийн сарын эрхийн төлбөрөөс татгалзсан шалтгааныг оруулна уу:","Бүртгэлийн мэдээлэл шаардлага хангаагүй.");
   if(entered===null)return;
   supplierRejectNote=entered.trim()||"Админы шийдвэрээр татгалзсан.";
  }
  try{
   if(type==="ad_payment")result=await db.rpc(action==="approve"?"admin_approve_payment_request":"admin_reject_payment_request",{p_request_id:id});
   else if(type==="posting_entitlement")result=await db.rpc("nexora_admin_review_posting_payment",{p_request_id:id,p_approve:action==="approve"});
   else if(type==="free_ad")result=await db.rpc("admin_review_free_ad",{p_ad_id:id,p_approve:action==="approve"});
   else if(type==="wholesale_order_payment"){
    result=await db.rpc("nexora_review_wholesale_order_payment",{p_payment_id:id,p_approve:action==="approve",p_note:action==="approve"?null:"Төлбөрийн баримт баталгаажаагүй"});
   }
   else if(type==="market_order_payment"){
    result=await db.rpc("nexora_review_market_order_payment",{p_payment_id:id,p_approve:action==="approve",p_note:action==="approve"?null:"Төлбөрийн баримт баталгаажаагүй"});
   }
   else if(["store_payment","retail_fee_payment","wholesale_fee_payment","supplier_registration_payment"].includes(type)){
    const kindMap={store_payment:"store",retail_fee_payment:"retail_fee",wholesale_fee_payment:"wholesale_fee",supplier_registration_payment:"supplier_registration"};
    const paymentId=String(id??"").trim();if(!paymentId)throw new Error("Төлбөрийн хүсэлтийн ID хоосон байна.");
    const note=action==="approve"?null:(supplierRejectNote||"Төлбөрийн баримт баталгаажаагүй");
    result=await db.rpc("nexora_review_commerce_payment",{p_payment_kind:kindMap[type],p_payment_id:paymentId,p_approve:action==="approve",p_note:note});
   }
   else if(type==="product")result=await db.rpc("nexora_review_market_retail_product",{p_product_id:id,p_approve:action==="approve"});
   else if(type==="wholesale_product")result=await db.rpc("nexora_review_wholesale_product",{p_product_id:id,p_approve:action==="approve"});
   else if(type==="supplier")result=await db.from("market_suppliers").update({status:action==="approve"?"approved":"rejected"}).eq("id",id);
   if(result?.error)throw result.error;
   alert("Хүсэлтийг амжилттай шийдвэрлэлээ.");
   await loadTab();
  }catch(e){alert("Үйлдэл амжилтгүй: "+(e?.message||e));}
 }
 function renderLogin(message="",isError=false){
   root.innerHTML='<section class="nx-admin-login"><h1>АДМИН НЭВТРЭХ</h1><p>Зөвхөн NEXORA админы эрхтэй бүртгэлээр нэвтэрнэ үү.</p><form id="nx-admin-login-form"><label for="nx-admin-email">И-мэйл</label><input id="nx-admin-email" name="email" type="email" autocomplete="username" required><label for="nx-admin-password">Нууц үг</label><input id="nx-admin-password" name="password" type="password" autocomplete="current-password" required><p id="nx-admin-login-message" class="'+(isError?'is-error':'')+'">'+esc(message)+'</p><button class="nx-admin-login-submit" type="submit">Нэвтрэх</button></form><a href="./index.html">← Хэрэглэгчийн сайт руу буцах</a></section>';
   document.getElementById("nx-admin-login-form").onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector("button[type=submit]"),v=Object.fromEntries(new FormData(form).entries());button.disabled=true;button.textContent="Шалгаж байна…";try{const {data,error}=await db.auth.signInWithPassword({email:String(v.email).trim(),password:v.password});if(error)throw error;if(!data?.session||!data?.user)throw new Error("Нэвтрэх session үүссэнгүй. Дахин оролдоно уу.");await init();}catch(error){renderLogin(error?.message||"Нэвтрэхэд алдаа гарлаа.",true);}};
  }
  async function init(){
   root.innerHTML='<div class="nx-admin-loading">Админ эрх шалгаж байна…</div>';
   try{
    const {data:sessionData,error:sessionError}=await db.auth.getSession();
    if(sessionError)throw sessionError;
    if(!sessionData?.session){renderLogin();return;}
    const {data,error}=await db.auth.getUser();
    if(error){if(/auth session missing/i.test(error.message||"")){await db.auth.signOut({scope:"local"});renderLogin("Session хугацаа дууссан байна. Дахин нэвтэрнэ үү.",true);return;}throw error;}
    if(!data?.user){renderLogin();return;}
    const {data:themeRow}=await db.from("nexora_settings").select("admin_theme_config").eq("id",1).maybeSingle();if(themeRow?.admin_theme_config)applyAdminTheme(themeRow.admin_theme_config);
    if(!(await adminCheck(data.user))){root.innerHTML='<section class="nx-admin-login"><h1>ХАНДАХ ЭРХГҮЙ</h1><p>Энэ бүртгэлд NEXORA админы эрх олгогдоогүй байна.</p><button class="nx-admin-login-submit" id="nx-admin-denied-logout" type="button">Өөр бүртгэлээр нэвтрэх</button><a href="./index.html">Хэрэглэгчийн сайт руу буцах</a></section>';document.getElementById("nx-admin-denied-logout").onclick=async()=>{await db.auth.signOut();renderLogin();};return;}
    loadTab();
   }catch(e){if(/auth session missing/i.test(e?.message||"")){await db.auth.signOut({scope:"local"});renderLogin("Session олдсонгүй. Админ эрхтэй бүртгэлээр дахин нэвтэрнэ үү.",true);return;}root.innerHTML='<div class="nx-admin-error">Админ эрх шалгахад алдаа гарлаа: '+esc(e?.message||e)+'</div>';}
  }
  init();
})();</script></body></html>
