
<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101326">
  <meta name="description" content="Nexora - Монголын зар мэдээлэл, худалдааны платформ">
  <title>Nexora | Зар мэдээлэл, худалдаа</title>
  <link rel="stylesheet" href="style.css">
<<head>
</body>

<style> 
:root {
  --bg: #101326;
  --panel: #191d34;
  --purple: #8264ff;
  --text: #f6f5ff;
  --muted: #a5a8bd;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.header {
  min-height: 82px;
  padding: 15px 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid #292d46;
  background: #101326;
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo {
  color: white;
  font-weight: 900;
  font-size: 27px;
  text-decoration: none;
  letter-spacing: 2px;
}
.logo span, .hero h1 span { color: var(--purple); }
.search {
  display: flex;
  max-width: 480px;
  width: 100%;
  background: var(--panel);
  border-radius: 12px;
  padding: 5px;
}
.search input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  color: white;
  padding: 12px;
  outline: none;
}
.search button, .primary {
  border: 0;
  color: white;
  background: var(--purple);
  border-radius: 9px;
  padding: 12px 20px;
  font-weight: bold;
}
nav { display: flex; gap: 12px; }
nav button {
  color: white;
  background: transparent;
  border: 1px solid #343853;
  border-radius: 9px;
  padding: 12px;
}
.hero {
  margin: 35px auto;
  width: 86%;
  min-height: 340px;
  border-radius: 25px;
  padding: 55px;
  background: linear-gradient(120deg,#222044,#30265e,#171d3b);
  display: flex;
  align-items: center;
  justify-content: space-between;
  overflow: hidden;
}
.tag {
  color: #a99aff;
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: bold;
}
.hero h1 {
  font-size: clamp(38px,6vw,64px);
  line-height: 1.13;
  margin: 20px 0;
}
.hero p {
  max-width: 430px;
  line-height: 1.8;
  color: #c2c1d7;
  margin-bottom: 25px;
}
.hero-art {
  font-size: 160px;
  font-weight: 900;
  color: #ffffff20;
  text-shadow: 0 0 60px #9275ff;
}
.hero-art span { color: #9275ff; }
.categories, .products-section {
  width: 86%;
  margin: 65px auto;
}
h2 { font-size: 25px; margin-bottom: 22px; }
.category-list {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.category {
  color: #dddcee;
  background: var(--panel);
  border: 1px solid #30334d;
  padding: 14px 20px;
  border-radius: 12px;
}
.category.active {
  background: var(--purple);
  border-color: var(--purple);
  color: white;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}
.section-heading h2 { margin-top: 10px; }
select, input, textarea {
  background: var(--panel);
  border: 1px solid #343853;
  color: white;
  border-radius: 9px;
  padding: 12px;
}
.product-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 20px;
}
.product {
  background: var(--panel);
  border: 1px solid #2a2e48;
  border-radius: 16px;
  overflow: hidden;
  transition: .25s;
}
.product:hover { transform: translateY(-5px); border-color: var(--purple); }
.product-image {
  width: 100%;
  height: 190px;
  object-fit: cover;
  background: #252942;
}
.product-info { padding: 16px; }
.product-info h3 { font-size: 16px; margin: 10px 0; }
.product-info p { color: var(--muted); font-size: 13px; }
.price { color: #a994ff; font-size: 20px; font-weight: bold; margin: 14px 0; }
.product-actions { display: flex; gap: 8px; }
.product-actions button {
  flex: 1;
  border: 1px solid #484267;
  background: transparent;
  color: white;
  padding: 10px;
  border-radius: 8px;
}
.product-actions button:first-child {
  background: var(--purple);
  border-color: var(--purple);
}
.empty { text-align: center; padding: 40px; color: var(--muted); }
.hidden { display: none !important; }
footer {
  border-top: 1px solid #292d46;
  padding: 35px 7%;
  display: flex;
  justify-content: space-between;
  color: var(--muted);
}
.modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: #000b;
  display: grid;
  place-items: center;
  padding: 15px;
}
.modal-content {
  width: min(500px,100%);
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  background: #191d34;
  padding: 30px;
  border-radius: 18px;
}
.close {
  float: right;
  background: none;
  color: white;
  border: 0;
  font-size: 22px;
}
.modal form { display: grid; gap: 12px; }
.modal label { color: #c4c1d8; font-size: 13px; }
.modal textarea { min-height: 90px; resize: vertical; }
.submit { margin-top: 10px; }
.detail-image {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  border-radius: 12px;
  margin: 15px 0;
}
@media(max-width:1000px) {
  .product-grid { grid-template-columns: repeat(3,1fr); }
}
@media(max-width:700px) {
  .header { flex-wrap: wrap; }
  .search { order: 3; max-width: 100%; }
  nav { margin-left: auto; }
  .hero { padding: 30px; width: 92%; }
  .hero-art { font-size: 75px; }
  .categories,.products-section { width: 92%; }
  .product-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
  .product-image { height: 140px; }
  footer { flex-direction: column; gap: 15px; }
}
@media(max-width:390px) {
  .product-grid { grid-template-columns: 1fr; }
}
</style>
  <header class="header">
    <a href="#" class="logo">NEXORA<span>.</span></a>
    <div class="search">
      <input id="searchInput" placeholder="Юу хайж байна вэ?">
      <button onclick="searchProducts()">Хайх</button>
    </div>
    <nav>
      <button onclick="showFavorites()">♡ Дуртай</button>
      <button class="primary" onclick="openModal()">+ Зар нэмэх</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <span class="tag">MONGOLIAN MARKETPLACE</span>
        <h1>Худалдаа хийх<br><span>шинэ боломж.</span></h1>
        <p>Хайсан бүхнээ ол. Хэрэггүй зүйлээ зар. Nexora дээр худалдаа илүү хялбар.</p>
        <button class="primary" onclick="openModal()">Зар нийтлэх →</button>
      </div>
      <div class="hero-art">N<span>X</span></div>
    </section>

    <section class="categories">
      <h2>Ангилал</h2>
      <div class="category-list">
        <button class="category active" data-category="Бүгд">🌐 Бүгд</button>
        <button class="category" data-category="Автомашин">🚗 Автомашин</button>
        <button class="category" data-category="Үл хөдлөх">🏠 Үл хөдлөх</button>
        <button class="category" data-category="Электроник">💻 Электроник</button>
        <button class="category" data-category="Хувцас">👕 Хувцас</button>
        <button class="category" data-category="Гэр ахуй">🛋️ Гэр ахуй</button>
        <button class="category" data-category="Бусад">📦 Бусад</button>
      </div>
    </section>

    <section class="products-section">
      <div class="section-heading">
        <div>
          <span class="tag">DISCOVER</span>
          <h2 id="sectionTitle">Шинэ зарууд</h2>
        </div>
        <select id="sortSelect" onchange="renderProducts()">
          <option value="new">Шинэ нь эхэндээ</option>
          <option value="low">Үнэ өсөхөөр</option>
          <option value="high">Үнэ буурахаар</option>
        </select>
      </div>
      <div id="productGrid" class="product-grid"></div>
      <p id="emptyMessage" class="empty hidden">Зар олдсонгүй.</p>
    </section>
  </main>

  <footer>
    <a class="logo" href="#">NEXORA<span>.</span></a>
    <p>© 2026 Nexora. Монголын худалдааны платформ.</p>
  </footer>

  <div class="modal hidden" id="adModal">
    <div class="modal-content">
      <button class="close" onclick="closeModal()">✕</button>
      <h2>Шинэ зар нийтлэх</h2>
      <form id="adForm">
        <label>Зарын нэр</label>
        <input id="adTitle" required maxlength="100" placeholder="Барааны нэр">

        <label>Үнэ (₮)</label>
        <input id="adPrice" type="number" min="1" required placeholder="Үнэ">

        <label>Ангилал</label>
        <select id="adCategory">
          <option>Автомашин</option>
          <option>Үл хөдлөх</option>
          <option>Электроник</option>
          <option>Хувцас</option>
          <option>Гэр ахуй</option>
          <option>Бусад</option>
        </select>

        <label>Зургийн URL</label>
        <input id="adImage" type="url" placeholder="https://example.com/image.jpg">

        <label>Тайлбар</label>
        <textarea id="adDescription" required maxlength="1000" placeholder="Барааныхаа талаар бичнэ үү"></textarea>

        <label>Холбоо барих утас</label>
        <input id="adPhone" type="tel" required placeholder="99112233">

        <button class="primary submit" type="submit">Зар нийтлэх</button>
      </form>
    </div>
  </div>

  <div class="modal hidden" id="detailModal">
    <div class="modal-content">
      <button class="close" onclick="closeDetail()">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
<script>
const STORAGE_KEY = "nexora_products_v1";
const FAVORITES_KEY = "nexora_favorites_v1";

const initialProducts = [
  {
    id: 1,
    title: "iPhone 15 Pro Max",
    price: 3200000,
    category: "Электроник",
    image: "https://images.unsplash.com/photo-1696446702183-cbd13d5b6c2d?w=700",
    description: "Сайн хэрэглэсэн, бүрэн ажиллагаатай.",
    phone: "99112233",
    createdAt: Date.now()
  },
  {
    id: 2,
    title: "Toyota Prius 30",
    price: 18500000,
    category: "Автомашин",
    image: "https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=700",
    description: "Арчилгаа сайн, өдөр тутам унаж байсан.",
    phone: "88112233",
    createdAt: Date.now() - 1000
  },
  {
    id: 3,
    title: "Орчин үеийн буйдан",
    price: 850000,
    category: "Гэр ахуй",
    image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=700",
    description: "Гоёмсог загвартай, цэвэрхэн.",
    phone: "99113344",
    createdAt: Date.now() - 2000
  },
  {
    id: 4,
    title: "Загварлаг пүүз",
    price: 180000,
    category: "Хувцас",
    image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700",
    description: "Шинэ загварын пүүз.",
    phone: "99114455",
    createdAt: Date.now() - 3000
  }
];

function loadData(key, fallback) {
  try {
    const data = localStorage.getItem(key);
    return data ? JSON.parse(data) : fallback;
  } catch {
    return fallback;
  }
}

let products = loadData(STORAGE_KEY, initialProducts);
let favorites = loadData(FAVORITES_KEY, []);
let selectedCategory = "Бүгд";
let currentSearch = "";

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
  localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
}

function formatPrice(price) {
  return Number(price).toLocaleString("mn-MN") + " ₮";
}

function safeImage(url) {
  try {
    const parsed = new URL(url);
    return ["https:", "http:"].includes(parsed.protocol) ? parsed.href : "";
  } catch {
    return "";
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function renderProducts() {
  const grid = document.getElementById("productGrid");
  const sort = document.getElementById("sortSelect").value;

  let list = products.filter(p => {
    const categoryMatch =
      selectedCategory === "Бүгд" || p.category === selectedCategory;
    const searchMatch =
      (p.title + " " + p.description + " " + p.category)
      .toLowerCase().includes(currentSearch.toLowerCase());

    return categoryMatch && searchMatch;
  });

  if (sort === "low") list.sort((a,b) => a.price-b.price);
  if (sort === "high") list.sort((a,b) => b.price-a.price);
  if (sort === "new") list.sort((a,b) => b.createdAt-a.createdAt);

  grid.innerHTML = list.map(p => {
    const favorite = favorites.includes(p.id);
    const image = safeImage(p.image);

    return `
      <article class="product">
        <img class="product-image"
          src="${escapeHTML(image || "https://placehold.co/600x400/252942/ffffff?text=Nexora")}"
          alt="${escapeHTML(p.title)}"
          onerror="this.src='https://placehold.co/600x400/252942/ffffff?text=Nexora'">
        <div class="product-info">
          <p>${escapeHTML(p.category)}</p>
          <h3>${escapeHTML(p.title)}</h3>
          <div class="price">${formatPrice(p.price)}</div>
          <div class="product-actions">
            <button onclick="showDetail(${p.id})">Дэлгэрэнгүй</button>
            <button onclick="toggleFavorite(${p.id})">${favorite ? "♥" : "♡"}</button>
          </div>
        </div>
      </article>
    `;
  }).join("");

  document.getElementById("emptyMessage")
    .classList.toggle("hidden", list.length > 0);
}

function searchProducts() {
  currentSearch = document.getElementById("searchInput").value.trim();
  renderProducts();
}

document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") searchProducts();
});

document.querySelectorAll(".category").forEach(button => {
  button.addEventListener("click", () => {
    selectedCategory = button.dataset.category;

    document.querySelectorAll(".category")
      .forEach(item => item.classList.remove("active"));

    button.classList.add("active");
    document.getElementById("sectionTitle").textContent =
      selectedCategory === "Бүгд" ? "Шинэ зарууд" : selectedCategory;

    renderProducts();
  });
});

function openModal() {
  document.getElementById("adModal").classList.remove("hidden");
}

function closeModal() {
  document.getElementById("adModal").classList.add("hidden");
}

document.getElementById("adForm").addEventListener("submit", e => {
  e.preventDefault();

  const title = document.getElementById("adTitle").value.trim();
  const price = Number(document.getElementById("adPrice").value);
  const phone = document.getElementById("adPhone").value.trim();
  const description = document.getElementById("adDescription").value.trim();
  const image = safeImage(document.getElementById("adImage").value.trim());

  if (!title || !Number.isSafeInteger(price) || price <= 0 ||
      !phone || !description) {
    alert("Мэдээллээ зөв бөглөнө үү.");
    return;
  }

  products.unshift({
    id: Date.now(),
    title,
    price,
    category: document.getElementById("adCategory").value,
    image,
    description,
    phone,
    createdAt: Date.now()
  });

  saveData();
  renderProducts();
  e.target.reset();
  closeModal();
  alert("Таны зар амжилттай нийтлэгдлээ!");
});

function toggleFavorite(id) {
  favorites = favorites.includes(id)
    ? favorites.filter(item => item !== id)
    : [...favorites, id];

  saveData();
  renderProducts();
}

function showFavorites() {
  const favoriteIds = new Set(favorites);
  const grid = document.getElementById("productGrid");
  const list = products.filter(p => favoriteIds.has(p.id));

  grid.innerHTML = list.map(p => `
    <article class="product">
      <img class="product-image"
        src="${escapeHTML(safeImage(p.image) || "https://placehold.co/600x400")}"
        alt="${escapeHTML(p.title)}">
      <div class="product-info">
        <h3>${escapeHTML(p.title)}</h3>
        <div class="price">${formatPrice(p.price)}</div>
        <div class="product-actions">
          <button onclick="showDetail(${p.id})">Дэлгэрэнгүй</button>
          <button onclick="toggleFavorite(${p.id});showFavorites()">♥</button>
        </div>
      </div>
    </article>
  `).join("");

  document.getElementById("sectionTitle").textContent = "Дуртай зарууд";
  document.getElementById("emptyMessage")
    .classList.toggle("hidden", list.length > 0);
}

function showDetail(id) {
  const p = products.find(item => item.id === id);
  if (!p) return;

  const content = document.getElementById("detailContent");

  content.innerHTML = `
    <span class="tag">${escapeHTML(p.category)}</span>
    <h2>${escapeHTML(p.title)}</h2>
    <img class="detail-image"
      src="${escapeHTML(safeImage(p.image) || "https://placehold.co/600x400")}"
      alt="${escapeHTML(p.title)}">
    <div class="price">${formatPrice(p.price)}</div>
    <p>${escapeHTML(p.description)}</p>
    <p style="margin-top:20px">Холбоо барих: ${escapeHTML(p.phone)}</p>
    <button class="primary" style="margin-top:20px"
      onclick="deleteProduct(${p.id})">Зараа устгах</button>
  `;

  document.getElementById("detailModal").classList.remove("hidden");
}

function closeDetail() {
  document.getElementById("detailModal").classList.add("hidden");
}

function deleteProduct(id) {
  if (!confirm("Энэ зарыг устгах уу?")) return;

  products = products.filter(p => p.id !== id);
  favorites = favorites.filter(item => item !== id);

  saveData();
  closeDetail();
  renderProducts();
}

renderProducts();
</script>
</body>
</html>
